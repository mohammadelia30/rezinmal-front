services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # nginx داخلیِ بک‌اند روی شبکهٔ داکر (api + media + static)
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://nginx}
    container_name: rezinmal_front
    # در پروداکشن پشت nginx-proxy-manager: FRONTEND_BIND=127.0.0.1 بگذارید
    # تا پورت مستقیم از بیرون در دسترس نباشد (NPM از داخل شبکه وصل می‌شود).
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://nginx}
    restart: unless-stopped
    networks:
      - rozinmall_network

networks:
  # شبکه مشترک با پروژه Rozinweb (در docker-compose بک‌اند ساخته می‌شود)
  rozinmall_network:
    external: true
    name: rozinmall_network
